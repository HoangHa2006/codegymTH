<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách sản phẩm</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 30px;
    }
    h1 {
      text-align: center;
      color: #1565c0;
    }
    table {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #999;
      padding: 10px 14px;
    }
    th {
      background-color: #1565c0;
      color: #fff;
    }
    td:nth-child(2),
    td:nth-child(3) {
      text-align: right;
    }
    tr:nth-child(even) {
      background-color: #f2f6fa;
    }
  </style>
</head>
<body>

  <h1>Danh sách sản phẩm</h1>

  <table>
    <tr>
      <th>Tên sản phẩm</th>
      <th>Giá</th>
      <th>Số lượng</th>
    </tr>
    <tr>
      <td>Laptop Dell Inspiron</td>
      <td>15.000.000 đ</td>
      <td>10</td>
    </tr>
    <tr>
      <td>Điện thoại Samsung Galaxy</td>
      <td>12.500.000 đ</td>
      <td>25</td>
    </tr>
    <tr>
      <td>Tai nghe Bluetooth</td>
      <td>850.000 đ</td>
      <td>50</td>
    </tr>
    <tr>
      <td>Chuột không dây</td>
      <td>250.000 đ</td>
      <td>80</td>
    </tr>
    <tr>
      <td>Bàn phím cơ</td>
      <td>1.200.000 đ</td>
      <td>30</td>
    </tr>
  </table>

</body>
</html>
