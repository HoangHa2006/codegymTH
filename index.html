<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form thông tin</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 30px 15px;
    }
    form {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    h2 {
      text-align: center;
      color: #1565c0;
      margin-top: 0;
    }
    .row {
      margin-bottom: 15px;
    }
    label.title {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .hobbies label {
      margin-right: 12px;
      font-size: 15px;
    }
    .buttons {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 9px 20px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      margin: 0 5px;
    }
    button[type="submit"] { background-color: #1565c0; }
    button[type="reset"]  { background-color: #757575; }
  </style>
</head>
<body>

  <form action="#" method="post">
    <h2>Thông tin cá nhân</h2>

    <div class="row">
      <label class="title" for="yourname">Họ và tên:</label>
      <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên">
    </div>

    <div class="row">
      <label class="title" for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Nhập email">
    </div>

    <div class="row hobbies">
      <span class="title" style="display:block; font-weight:bold; margin-bottom:5px;">Sở thích:</span>
      <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
      <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
      <label><input type="checkbox" name="hobby" value="sport"> Thể thao</label>
      <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
    </div>

    <div class="buttons">
      <button type="submit">Gửi thông tin</button>
      <button type="reset">Nhập lại</button>
    </div>
  </form>

</body>
</html>
