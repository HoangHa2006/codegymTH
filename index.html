```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex Grow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành thuộc tính flex-grow</h1>

    <h2>Ví dụ 1: flex-grow trên item thứ 2</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item grow">2 (flex-grow: 1)</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>

    <h2>Ví dụ 2: So sánh flex-grow</h2>
    <div class="container">
        <div class="item grow-1">grow: 1</div>
        <div class="item grow-2">grow: 2</div>
        <div class="item grow-3">grow: 3</div>
    </div>

    <h2>Ví dụ 3: Không sử dụng flex-grow</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
