<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký người dùng</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 30px 15px;
    }
    form {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    h2 {
      text-align: center;
      color: #1565c0;
      margin-top: 0;
    }
    .row {
      margin-bottom: 15px;
    }
    .title {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .options label {
      margin-right: 15px;
      font-size: 15px;
    }
    .buttons {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 9px 25px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      color: #fff;
      background-color: #1565c0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
    <h2>Đăng ký người dùng</h2>

    <div class="row">
      <label class="title" for="name">Họ và tên:</label>
      <input type="text" id="name" name="name" placeholder="Nhập họ và tên">
    </div>

    <div class="row">
      <label class="title" for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Nhập email">
    </div>

    <div class="row">
      <label class="title" for="phone">Số điện thoại:</label>
      <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại">
    </div>

    <div class="row options">
      <span class="title">Giới tính:</span>
      <label><input type="radio" name="gender" value="Nam"> Nam</label>
      <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
      <label><input type="radio" name="gender" value="Khác"> Khác</label>
    </div>

    <div class="buttons">
      <button type="submit">Đăng ký</button>
    </div>
  </form>

</body>
</html>
