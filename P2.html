<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký học viên</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 30px 15px;
    }
    form {
      max-width: 550px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    h2 {
      text-align: center;
      color: #1565c0;
      margin-top: 0;
    }
    .row {
      margin-bottom: 15px;
    }
    .title {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 15px;
      font-family: inherit;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
    }
    .options label {
      margin-right: 15px;
      font-size: 15px;
    }
    .buttons {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 9px 22px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      margin: 0 5px;
    }
    button[type="submit"] { background-color: #2e7d32; }
    button[type="reset"]  { background-color: #757575; }
  </style>
</head>
<body>

  <form action="#" method="post">
    <h2>Đăng ký học viên</h2>

    <div class="row">
      <label class="title" for="fullname">Họ và tên:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên">
    </div>

    <div class="row">
      <label class="title" for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Nhập email">
    </div>

    <div class="row">
      <label class="title" for="phone">Số điện thoại:</label>
      <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại">
    </div>

    <div class="row">
      <label class="title" for="birthday">Ngày sinh:</label>
      <input type="date" id="birthday" name="birthday">
    </div>

    <div class="row options">
      <span class="title">Giới tính:</span>
      <label><input type="radio" name="gender" value="male"> Nam</label>
      <label><input type="radio" name="gender" value="female"> Nữ</label>
      <label><input type="radio" name="gender" value="other"> Khác</label>
    </div>

    <div class="row">
      <label class="title" for="address">Địa chỉ:</label>
      <textarea id="address" name="address" rows="2" placeholder="Nhập địa chỉ"></textarea>
    </div>

    <div class="row">
      <label class="title" for="course">Khóa học:</label>
      <select id="course" name="course">
        <option value="html-css">HTML &amp; CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="python">Python</option>
      </select>
    </div>

    <div class="row options">
      <span class="title">Hình thức học:</span>
      <label><input type="radio" name="study_type" value="online"> Online</label>
      <label><input type="radio" name="study_type" value="offline"> Offline</label>
    </div>

    <div class="row options">
      <span class="title">Sở thích:</span>
      <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
      <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
      <label><input type="checkbox" name="hobby" value="sport"> Thể thao</label>
      <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
    </div>

    <div class="row">
      <label class="title" for="note">Ghi chú:</label>
      <textarea id="note" name="note" rows="3" placeholder="Nhập ghi chú"></textarea>
    </div>

    <div class="buttons">
      <button type="submit">Đăng ký</button>
      <button type="reset">Nhập lại</button>
    </div>
  </form>

</body>
</html>
